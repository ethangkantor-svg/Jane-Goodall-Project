<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="siteBBeforeTitle">
  <title id="siteBBeforeTitle">Before: a riverbank with reeds and rocks, tangled with plastic bottles, a bag, and a wrapper</title>
  <defs>
    <linearGradient id="bSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edee"/><stop offset="1" stop-color="#a9d6cf"/>
    </linearGradient>
    <linearGradient id="bWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9aa8"/><stop offset="1" stop-color="#0f3b47"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bSky)"/>
  <path d="M0 340c220-20 340 20 500 0s180-20 300 5v255H0z" fill="url(#bWater)"/>
  <path d="M20 380q220-15 400 5t360-5" fill="none" stroke="#7fcdd6" stroke-width="4" opacity="0.35"/>

  <!-- rocks -->
  <g fill="#8a8478">
    <ellipse cx="120" cy="380" rx="60" ry="26"/>
    <ellipse cx="70" cy="400" rx="40" ry="20"/>
    <ellipse cx="680" cy="370" rx="55" ry="24"/>
  </g>

  <!-- reeds -->
  <g stroke="#33562c" stroke-width="8" stroke-linecap="round">
    <path d="M40 600V320"/><path d="M90 600V280"/><path d="M700 600V300"/><path d="M760 600V260"/>
  </g>

  <!-- litter tangled in reeds -->
  <g transform="translate(250,340)">
    <path d="M4 22c0-9 5-14 10-14s10 5 10 14l-2 22H6z" fill="#eef7f4" stroke="#b5501f" stroke-width="2.5"/>
    <rect x="9" y="2" width="10" height="7" rx="2" fill="#b5501f"/>
  </g>
  <g transform="translate(320,380) rotate(20)">
    <path d="M0 14c16-12 46-12 62 2 4 14-10 24-31 24S-4 28 0 14z" fill="#eef7f4" stroke="#c7bb9e" stroke-width="2.5"/>
  </g>
  <g transform="translate(420,360) rotate(-15)">
    <rect x="0" y="0" width="18" height="52" rx="7" fill="#3d9aa8" opacity="0.85"/>
    <ellipse cx="9" cy="0" rx="9" ry="3" fill="#d9edee"/>
  </g>
  <g transform="translate(560,400) rotate(10)">
    <rect x="0" y="0" width="24" height="16" rx="3" fill="#b5501f" opacity="0.75"/>
  </g>
  <g transform="translate(500,340)">
    <ellipse cx="12" cy="4" rx="20" ry="6" fill="#f6c453" opacity="0.85"/>
  </g>
</svg>
