<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="siteCAfterTitle">
  <title id="siteCAfterTitle">After: the same trailhead, tidy with the trash can emptied and a new sign about pathway care</title>
  <defs>
    <linearGradient id="caSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edee"/><stop offset="1" stop-color="#f6f2ea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#caSky)"/>
  <path d="M0 300c200-15 320 15 460 0s200-20 340 5v20H0z" fill="#7fae5f" opacity="0.35"/>
  <rect x="0" y="320" width="800" height="280" fill="#e8e0d2"/>
  <path d="M0 340c260-20 380 0 500 0s200-20 300 0v260H0z" fill="#d9cfba"/>

  <g fill="#4a7c3f" opacity="0.6">
    <ellipse cx="90" cy="300" rx="90" ry="55"/>
    <ellipse cx="710" cy="290" rx="100" ry="60"/>
  </g>

  <!-- trailhead sign post, same position -->
  <g transform="translate(560,360)">
    <rect x="18" y="0" width="10" height="130" fill="#8a6544"/>
    <rect x="-20" y="-10" width="86" height="46" rx="6" fill="#4a7c3f"/>
    <rect x="-12" y="0" width="70" height="8" rx="2" fill="#e4efd9"/>
    <rect x="-12" y="14" width="50" height="8" rx="2" fill="#e4efd9"/>
  </g>

  <!-- trash can, emptied and lidded -->
  <g transform="translate(160,400)">
    <path d="M0 20h70l-8 100H8z" fill="#4d5a56"/>
    <ellipse cx="35" cy="20" rx="35" ry="9" fill="#374240"/>
    <ellipse cx="35" cy="14" rx="38" ry="10" fill="#7fae5f"/>
  </g>

  <!-- clean path, small planted flowers where litter was -->
  <g>
    <g transform="translate(84,522)"><circle r="4" cy="-10" fill="#f6c453"/><circle r="4" cy="-10" cx="6" fill="#f6c453"/><circle r="4" cy="-4" cx="6" fill="#f6c453"/><circle r="4" cy="-4" fill="#f6c453"/><line x1="3" y1="-2" x2="3" y2="8" stroke="#4a7c3f" stroke-width="2"/></g>
    <g transform="translate(280,494)"><circle r="4" cy="-10" fill="#eef7f4"/><circle r="4" cy="-10" cx="6" fill="#eef7f4"/><circle r="4" cy="-4" cx="6" fill="#eef7f4"/><circle r="4" cy="-4" fill="#eef7f4"/><circle r="2.5" cy="-7" cx="3" fill="#f6c453"/><line x1="3" y1="-2" x2="3" y2="8" stroke="#4a7c3f" stroke-width="2"/></g>
  </g>

  <!-- volunteer-made "pack it in, pack it out" sign near the can -->
  <g transform="translate(150,470)">
    <rect x="0" y="0" width="90" height="6" fill="#8a6544"/>
    <rect x="0" y="-40" width="90" height="42" rx="4" fill="#f6f2ea" stroke="#4a7c3f" stroke-width="2"/>
    <text x="45" y="-22" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#33562c" text-anchor="middle">PACK IT IN,</text>
    <text x="45" y="-8" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#33562c" text-anchor="middle">PACK IT OUT</text>
  </g>
</svg>
