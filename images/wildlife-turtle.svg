<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="turtleTitle">
  <title id="turtleTitle">Illustration of a painted turtle resting on a log in the river</title>
  <defs>
    <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edee"/>
      <stop offset="1" stop-color="#a9d6cf"/>
    </linearGradient>
    <linearGradient id="tWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9aa8"/>
      <stop offset="1" stop-color="#0f3b47"/>
    </linearGradient>
    <linearGradient id="tLog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9835a"/>
      <stop offset="1" stop-color="#6f4e33"/>
    </linearGradient>
    <linearGradient id="tShell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fae5f"/>
      <stop offset="1" stop-color="#33562c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#tSky)"/>
  <path d="M0 330c200-20 320 20 480 0s220-30 320-5v275H0z" fill="url(#tWater)"/>
  <path d="M0 360c200-15 340 15 500 0s200-20 300 0" fill="none" stroke="#7fcdd6" stroke-width="4" opacity="0.4"/>
  <path d="M40 420q200-20 380 0t340 0" fill="none" stroke="#a9e2e6" stroke-width="3" opacity="0.3"/>

  <!-- distant reeds -->
  <g stroke="#4a7c3f" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <path d="M60 330V220"/><path d="M100 330V240"/><path d="M700 330V210"/><path d="M740 330V250"/>
  </g>

  <!-- log spanning the water -->
  <g transform="translate(150,330)">
    <ellipse cx="250" cy="60" rx="270" ry="42" fill="url(#tLog)"/>
    <ellipse cx="250" cy="42" rx="270" ry="30" fill="#c39a6b"/>
    <ellipse cx="10" cy="42" rx="26" ry="30" fill="#8a6544"/>
    <path d="M60 30c30 6 60 6 90 0M170 26c30 6 60 6 90 0M290 30c30 6 60 6 90 0" fill="none" stroke="#6f4e33" stroke-width="3" opacity="0.6"/>
    <ellipse cx="470" cy="46" rx="20" ry="26" fill="#8a6544"/>
  </g>

  <!-- turtle on the log -->
  <g transform="translate(330,300)">
    <ellipse cx="70" cy="110" rx="90" ry="18" fill="#0f3b47" opacity="0.12"/>
    <!-- shell -->
    <ellipse cx="70" cy="60" rx="80" ry="52" fill="url(#tShell)"/>
    <g stroke="#254321" stroke-width="2.5" fill="none" opacity="0.7">
      <path d="M70 12v96"/>
      <path d="M12 60h116"/>
      <path d="M28 24l84 72"/>
      <path d="M112 24L28 96"/>
    </g>
    <!-- legs -->
    <ellipse cx="10" cy="90" rx="16" ry="10" fill="#7fae5f" transform="rotate(-20 10 90)"/>
    <ellipse cx="130" cy="90" rx="16" ry="10" fill="#7fae5f" transform="rotate(20 130 90)"/>
    <ellipse cx="0" cy="45" rx="14" ry="9" fill="#7fae5f" transform="rotate(-30 0 45)"/>
    <!-- head + neck -->
    <path d="M150 55c16-4 30 2 34 14s-6 20-18 20-24-10-24-22z" fill="#7fae5f"/>
    <circle cx="182" cy="70" r="3" fill="#0f3b47"/>
    <path d="M150 55c6-8 12-8 16-4" fill="none" stroke="#33562c" stroke-width="2" opacity="0.6"/>
  </g>
</svg>
