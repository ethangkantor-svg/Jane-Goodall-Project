<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="siteAAfterTitle">
  <title id="siteAAfterTitle">After: the same park bench area, now clear of litter with wildflowers blooming in the grass</title>
  <defs>
    <linearGradient id="aaSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9e0e0"/>
      <stop offset="1" stop-color="#e8e0d2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#aaSky)"/>
  <path d="M0 260c250-15 350 15 500 0s170-10 300 10v20H0z" fill="#7fae5f" opacity="0.4"/>
  <rect x="0" y="280" width="800" height="320" fill="#dbe6c9"/>
  <path d="M260 600c10-140 60-170 140-170s130 30 140 170z" fill="#e8e0d2" opacity="0.7"/>

  <g fill="#4a7c3f" opacity="0.7">
    <ellipse cx="90" cy="270" rx="90" ry="55"/>
    <ellipse cx="710" cy="260" rx="100" ry="60"/>
  </g>

  <!-- bench, same as before -->
  <g transform="translate(330,340)">
    <rect x="0" y="30" width="140" height="10" rx="3" fill="#8a6544"/>
    <rect x="0" y="55" width="140" height="10" rx="3" fill="#8a6544"/>
    <rect x="0" y="0" width="140" height="10" rx="3" fill="#6f4e33"/>
    <rect x="6" y="65" width="10" height="40" fill="#4d3521"/>
    <rect x="124" y="65" width="10" height="40" fill="#4d3521"/>
  </g>

  <!-- litter replaced with wildflowers -->
  <g>
    <g transform="translate(214,486)"><circle r="5" cy="-14" fill="#f6c453"/><circle r="5" cy="-14" cx="8" fill="#f6c453"/><circle r="5" cy="-6" cx="8" fill="#f6c453"/><circle r="5" cy="-6" fill="#f6c453"/><circle r="3" cy="-10" cx="4" fill="#b5501f"/><line x1="4" y1="-4" x2="4" y2="10" stroke="#4a7c3f" stroke-width="2"/></g>
    <g transform="translate(444,494)"><circle r="5" cy="-14" fill="#eef7f4"/><circle r="5" cy="-14" cx="8" fill="#eef7f4"/><circle r="5" cy="-6" cx="8" fill="#eef7f4"/><circle r="5" cy="-6" fill="#eef7f4"/><circle r="3" cy="-10" cx="4" fill="#f6c453"/><line x1="4" y1="-4" x2="4" y2="10" stroke="#4a7c3f" stroke-width="2"/></g>
    <g transform="translate(560,504)"><circle r="5" cy="-14" fill="#f6c453"/><circle r="5" cy="-14" cx="8" fill="#f6c453"/><circle r="5" cy="-6" cx="8" fill="#f6c453"/><circle r="5" cy="-6" fill="#f6c453"/><circle r="3" cy="-10" cx="4" fill="#b5501f"/><line x1="4" y1="-4" x2="4" y2="10" stroke="#4a7c3f" stroke-width="2"/></g>
    <g transform="translate(300,520)"><circle r="4" cy="-10" fill="#eef7f4"/><circle r="4" cy="-10" cx="6" fill="#eef7f4"/><circle r="4" cy="-4" cx="6" fill="#eef7f4"/><circle r="4" cy="-4" fill="#eef7f4"/><line x1="3" y1="-2" x2="3" y2="8" stroke="#4a7c3f" stroke-width="2"/></g>
  </g>

  <!-- butterfly for a lived-in, cared-for feel -->
  <g transform="translate(500,380)">
    <path d="M0 0c-10-14-26-10-24 4s16 10 24 4c8 6 22 10 24-4s-14-18-24-4z" fill="#f6c453" opacity="0.9"/>
    <line x1="0" y1="-2" x2="0" y2="10" stroke="#0f3b47" stroke-width="1.5"/>
  </g>
</svg>
