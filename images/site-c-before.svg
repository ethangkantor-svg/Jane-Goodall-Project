<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="siteCBeforeTitle">
  <title id="siteCBeforeTitle">Before: the pathway trailhead with a trash can overflowing and litter scattered around its base</title>
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edee"/><stop offset="1" stop-color="#f6f2ea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cSky)"/>
  <path d="M0 300c200-15 320 15 460 0s200-20 340 5v20H0z" fill="#7fae5f" opacity="0.35"/>
  <rect x="0" y="320" width="800" height="280" fill="#e8e0d2"/>
  <path d="M0 340c260-20 380 0 500 0s200-20 300 0v260H0z" fill="#d9cfba"/>

  <g fill="#4a7c3f" opacity="0.6">
    <ellipse cx="90" cy="300" rx="90" ry="55"/>
    <ellipse cx="710" cy="290" rx="100" ry="60"/>
  </g>

  <!-- trailhead sign post -->
  <g transform="translate(560,360)">
    <rect x="18" y="0" width="10" height="130" fill="#8a6544"/>
    <rect x="-20" y="-10" width="86" height="46" rx="6" fill="#4a7c3f"/>
    <rect x="-12" y="0" width="70" height="8" rx="2" fill="#e4efd9"/>
    <rect x="-12" y="14" width="50" height="8" rx="2" fill="#e4efd9"/>
  </g>

  <!-- overflowing trash can -->
  <g transform="translate(160,400)">
    <path d="M0 20h70l-8 100H8z" fill="#4d5a56"/>
    <ellipse cx="35" cy="20" rx="35" ry="9" fill="#374240"/>
    <path d="M-6 6c14-16 68-16 82 0" fill="none" stroke="#374240" stroke-width="6"/>
    <path d="M8 4c10-16 44-16 54 0" fill="#eef7f4" opacity="0.9"/>
    <path d="M20 -4c8-10 22-10 30 0" fill="#b5501f" opacity="0.8"/>
  </g>

  <!-- litter scattered around the can -->
  <g transform="translate(80,510)">
    <path d="M4 16c0-7 4-11 8-11s8 4 8 11l-2 18H6z" fill="#eef7f4" stroke="#b5501f" stroke-width="2"/>
  </g>
  <g transform="translate(260,520) rotate(-12)">
    <rect x="0" y="0" width="16" height="42" rx="6" fill="#3d9aa8" opacity="0.8"/>
  </g>
  <g transform="translate(300,480)">
    <path d="M0 10c12-8 34-8 46 2 2 10-8 16-23 16S-2 20 0 10z" fill="#eef7f4" stroke="#c7bb9e" stroke-width="2"/>
  </g>
  <g transform="translate(200,470) rotate(8)">
    <rect x="0" y="0" width="18" height="12" rx="3" fill="#b5501f" opacity="0.7"/>
  </g>
</svg>
