<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="heronTitle">
  <title id="heronTitle">Illustration of a great blue heron standing at the edge of the river among reeds</title>
  <defs>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9edee"/>
      <stop offset="1" stop-color="#a9d6cf"/>
    </linearGradient>
    <linearGradient id="hWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9aa8"/>
      <stop offset="1" stop-color="#0f3b47"/>
    </linearGradient>
    <linearGradient id="hBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d8f98"/>
      <stop offset="1" stop-color="#42636c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#hSky)"/>
  <path d="M0 360c180-30 320 10 480-10s220-30 320 0v250H0z" fill="url(#hWater)"/>
  <path d="M20 390c180-20 320 15 470-5s220-25 300 0" fill="none" stroke="#7fcdd6" stroke-width="4" opacity="0.4"/>

  <!-- far reeds -->
  <g stroke="#4a7c3f" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M60 380V240"/><path d="M90 380V260"/><path d="M120 380V230"/>
    <path d="M660 380V250"/><path d="M700 380V220"/><path d="M730 380V270"/>
  </g>
  <g fill="#4a7c3f" opacity="0.55">
    <ellipse cx="60" cy="235" rx="7" ry="16"/><ellipse cx="120" cy="225" rx="7" ry="16"/>
    <ellipse cx="700" cy="215" rx="7" ry="16"/>
  </g>

  <!-- near reeds foreground -->
  <g stroke="#33562c" stroke-width="9" stroke-linecap="round">
    <path d="M40 600V300"/><path d="M85 600V270"/><path d="M700 600V320"/><path d="M750 600V280"/>
  </g>
  <g fill="#33562c">
    <ellipse cx="40" cy="292" rx="9" ry="20"/><ellipse cx="85" cy="262" rx="9" ry="20"/>
    <ellipse cx="750" cy="272" rx="9" ry="20"/>
  </g>

  <!-- heron -->
  <g transform="translate(330,140)">
    <ellipse cx="70" cy="330" rx="66" ry="13" fill="#0f3b47" opacity="0.15"/>
    <!-- legs -->
    <path d="M55 240 L45 330" stroke="#c9a05b" stroke-width="6" stroke-linecap="round"/>
    <path d="M85 240 L95 330" stroke="#c9a05b" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 330 l-16 8M45 330 l0 12M52 330 l14 6" stroke="#c9a05b" stroke-width="5" stroke-linecap="round"/>
    <path d="M88 330 l-14 6M95 330 l0 12M102 330 l16 8" stroke="#c9a05b" stroke-width="5" stroke-linecap="round"/>
    <!-- body: slim oval, leaning slightly forward -->
    <ellipse cx="70" cy="190" rx="44" ry="62" fill="url(#hBody)" transform="rotate(-6 70 190)"/>
    <!-- folded wing detail -->
    <path d="M40 150c-4 30 2 62 20 84" fill="none" stroke="#33505a" stroke-width="4" opacity="0.4"/>
    <!-- tail feathers -->
    <path d="M104 224c16 6 26 18 28 32-18-2-32-12-38-24z" fill="#3a565e"/>
    <!-- neck, S-curve -->
    <path d="M56 132c-10-30 4-52 2-72 -2-18-16-30-28-38" stroke="url(#hBody)" stroke-width="19" stroke-linecap="round" fill="none"/>
    <!-- head -->
    <ellipse cx="26" cy="16" rx="15" ry="12" fill="url(#hBody)"/>
    <!-- beak -->
    <path d="M11 12c-15-3-26 1-30 8 11 3 20 0 27-4z" fill="#f6c453"/>
    <!-- eye -->
    <circle cx="29" cy="12" r="2.4" fill="#0f3b47"/>
    <!-- head plume -->
    <path d="M18 3c5-7 13-8 18-4" fill="none" stroke="#0f3b47" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ripples -->
  <path d="M420 420q30-10 60 0t60 0" fill="none" stroke="#7fcdd6" stroke-width="3" opacity="0.5"/>
</svg>
